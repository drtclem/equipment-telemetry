[tool.ruff]
line-length = 100
target-version = "py312"
# telemetry_generator.py is provided by the graders — kept byte-for-byte, not linted.
exclude = ["telemetry_generator.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
