name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: telemetry
          POSTGRES_PASSWORD: telemetry
          POSTGRES_DB: telemetry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telemetry -d telemetry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q
        env:
          DATABASE_URL: postgresql://telemetry:telemetry@localhost:5432/telemetry
          REDIS_URL: redis://localhost:6379/1
